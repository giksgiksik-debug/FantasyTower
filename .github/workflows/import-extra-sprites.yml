name: Import extra sprite assets

on:
  push:
    branches:
      - setup/phaser-vite-capacitor
    paths:
      - '.github/workflows/import-extra-sprites.yml'
      - 'scripts/import-extra-sprites.mjs'

permissions:
  contents: write

jobs:
  extract-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and inspect additional PNG files
        run: node scripts/import-extra-sprites.mjs

      - name: Commit extracted assets and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/assets/phaser-assets
          git add src/systems/SpriteAssets.js
          git add EXTRA_ASSET_REPORT.md
          if git diff --cached --quiet; then
            echo "No extracted asset changes to commit."
            exit 0
          fi
          git commit -m "Replace old sprite set with complete validated archive"
          git push origin "HEAD:${GITHUB_REF_NAME}"
