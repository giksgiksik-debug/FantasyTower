name: Inspect source archives
on:
  push:
    paths:
      - ".github/workflows/inspect-source-archives.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: setup/phaser-vite-capacitor
          persist-credentials: true
      - name: Extract original world map and add it to the game assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/maps
          unzip -p "FantasyTower-starter-assets.zip" "public/assets/maps/world-map.jpg" > public/assets/maps/world-map.jpg
          test -s public/assets/maps/world-map.jpg
          file public/assets/maps/world-map.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/maps/world-map.jpg
          git commit -m "Restore original world map from starter assets"
          git push origin HEAD:setup/phaser-vite-capacitor
