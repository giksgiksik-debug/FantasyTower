name: Deploy SpriteForge 3D
on:
  push:
    branches: [tool/spriteforge-3d]
    paths:
      - "tools/spriteforge-3d/**"
      - ".github/workflows/spriteforge-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "spriteforge-pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check tools/spriteforge-3d/app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools/spriteforge-3d
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
